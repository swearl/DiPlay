[versions]
agp = "8.4.2"
kotlin = "2.2.10"

[libraries]
# 纯 Java 依赖，无 androidx，可在 API 19 直接使用
bouncycastle = { module = "org.bouncycastle:bcprov-jdk15on", version = "1.70" }
jmdns = { module = "org.jmdns:jmdns", version = "3.5.1" }
# 更新检查 TLS 栈：okhttp 3.12.x 是最后支持 Android 4.4 的版本线，OkUrlFactory 位于 okhttp-urlconnection 构件，
# conscrypt-android 自带 BoringSSL（TLS 1.2 + AEAD 套件），替换系统栈修复 4.4 握手失败
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "3.12.13" }
okhttpUrlConnection = { module = "com.squareup.okhttp3:okhttp-urlconnection", version = "3.12.13" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version = "2.5.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
